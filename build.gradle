plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = '1.13.1'
def pluginMainClass = 'com.lootluck.LootLuckLauncher'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	implementation 'org.apache.commons:commons-math3:3.6.1'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.lootluck'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs '-ea', '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
	args "--developer-mode", "--debug"
}

tasks.register('runProfile', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.lootluck.ui.LootLuckProfileLauncher'
	jvmArgs '-ea', '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
		'-XX:+UnlockDiagnosticVMOptions', '-XX:+DebugNonSafepoints', '-XX:+PreserveFramePointer',
		'-XX:FlightRecorderOptions=stackdepth=128'
	args '--developer-mode', '--debug'
}

tasks.register('fixture', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.lootluck.FixtureLauncher'
	jvmArgs '-ea', '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
}

tasks.register('recordRuntime') {
	doLast {
		def client = configurations.testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find { it.moduleVersion.id.group == 'net.runelite' && it.name == 'client' }
		println "Resolved RuneLite: ${client.moduleVersion.id.version}; Java: ${System.getProperty('java.version')}"
	}
}

tasks.register('generateRates', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.lootluck.GenerateRates'
	args 'tools/wiki-inputs', 'src/main/resources/rates/catalogue.json', '2026-10-02T00:00:00Z'
}

tasks.register('auditRecordedLoot', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.lootluck.AuditRecordedLoot'
}

tasks.register('copyMathNotices', Copy) {
	def math = configurations.runtimeClasspath.filter { it.name == 'commons-math3-3.6.1.jar' }
	from({ math.collect { zipTree(it) } }) {
		include 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt'
		eachFile { path = "commons-math3-${name}" }
		includeEmptyDirs = false
	}
	into 'src/main/resources/META-INF'
}
tasks.named('processResources') { mustRunAfter 'copyMathNotices' }

tasks.register('verifyMathArtifact') {
	doLast {
		def artifact = configurations.runtimeClasspath.find { it.name == 'commons-math3-3.6.1.jar' }
		def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(artifact.bytes).encodeHex().toString()
		assert sha1 == 'e4ba98f1d4b3c80ec46392f25e094a6a2e58fcbf' : 'Commons Math checksum differs from Maven Central publication'
		println 'Commons Math matches Maven Central SHA-1; Gradle independently enforces pinned SHA-256.'
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
